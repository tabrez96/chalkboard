name: CI
on:
  push:
    branches: [develop, master]
  pull_request:
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - run: uv sync --frozen
      - run: uv run ruff format --check . && uv run ruff check .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx prettier@3.10.1 --check .
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg19
        env:
          POSTGRES_USER: chalkboard
          POSTGRES_PASSWORD: chalkboard
          POSTGRES_DB: chalkboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chalkboard" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - run: uv sync --frozen
      - run: uv run pytest
