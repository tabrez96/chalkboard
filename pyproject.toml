[project]
name = "chalkboard"
version = "0.1.0"
description = "Teacher-approved sources in, cited course plans out"
readme = "README.md"
requires-python = "==3.15.*"
dependencies = [
  "flask==3.1.3",
  "sqlalchemy==2.1.9",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.9",
  "pgvector==0.5.1",
  "pydantic-settings==2.16.3",
  "gunicorn==27.0.1",
  "flask-wtf==1.3.0",
  "argon2-cffi==25.1.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[tool.ruff.lint]
# Defaults plus import sorting (handbook: ruff check covers import order).
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
