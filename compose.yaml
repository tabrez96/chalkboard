services:
  db:
    image: pgvector/pgvector:0.8.7-pg19
    environment:
      POSTGRES_USER: chalkboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chalkboard}
      POSTGRES_DB: chalkboard
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chalkboard -d chalkboard"]
      interval: 2s
      timeout: 5s
      retries: 30
  web:
    build: .
    environment: &app-env
      CHALKBOARD_DATABASE_URL: postgresql+psycopg://chalkboard:${POSTGRES_PASSWORD:-chalkboard}@db:5432/chalkboard
      CHALKBOARD_SECRET_KEY: ${CHALKBOARD_SECRET_KEY:-dev-not-secret}
      CHALKBOARD_OLLAMA_URL: ${CHALKBOARD_OLLAMA_URL:-http://localhost:11434}
      CHALKBOARD_EMBED_MODEL: ${CHALKBOARD_EMBED_MODEL:-qwen3-embedding:0.6b}
      CHALKBOARD_WRITE_MODEL: ${CHALKBOARD_WRITE_MODEL:-qwen3.5:9b}
    volumes:
      - data:/app/data
      - backups:/app/backups
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: .
    command: ["flask", "--app", "chalkboard", "worker"]
    environment: *app-env
    volumes:
      - data:/app/data
      - backups:/app/backups
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
volumes:
  pgdata:
  data:
  backups:
