<!doctype html>
<html lang="en" data-theme="{{ g.teacher.theme if g.get('teacher') else 'system' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{% endblock %} · Chalkboard</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='brand/mark.svg') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}" />
  </head>
  <body>
    {% block body %}{% endblock %}
    {% block scripts %}{% endblock %}
  </body>
</html>
