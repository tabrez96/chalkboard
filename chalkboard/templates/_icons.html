{% macro icon(name, size=18) -%}
<svg viewBox="0 0 24 24" width="{{ size }}" height="{{ size }}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {%- if name == "grid" -%}
  <rect x="3" y="3" width="7" height="7" rx="1.5" /><rect x="14" y="3" width="7" height="7" rx="1.5" /><rect x="3" y="14" width="7" height="7" rx="1.5" /><rect x="14" y="14" width="7" height="7" rx="1.5" />
  {%- elif name == "calendar" -%}
  <rect x="3" y="5" width="18" height="16" rx="2" /><path d="M8 3v4M16 3v4M3 10h18" />
  {%- elif name == "overview" -%}
  <path d="M6 3h9l4 4v14H6z" /><path d="M14 3v5h5M9 13h7M9 17h7" />
  {%- elif name == "book" -%}
  <rect x="3" y="4" width="18" height="16" rx="2" /><path d="M12 4v16M7 9h2M15 9h2" />
  {%- elif name == "file" -%}
  <path d="M6 3h8l5 5v13H6z" /><path d="M14 3v5h5" />
  {%- elif name == "users" -%}
  <circle cx="9" cy="8" r="3.5" /><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.4c2 .8 3.5 2.7 3.5 5.6" />
  {%- elif name == "gear" -%}
  <circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" />
  {%- elif name == "sun" -%}
  <circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
  {%- elif name == "moon" -%}
  <path d="M20 14.5A8 8 0 1 1 9.5 4 6.5 6.5 0 0 0 20 14.5z" />
  {%- elif name == "sidebar" -%}
  <rect x="3" y="4" width="18" height="16" rx="2" /><path d="M9 4v16" />
  {%- elif name == "chevron-down" -%}
  <path d="m6 9 6 6 6-6" />
  {%- elif name == "check" -%}
  <path d="m5 12 5 5 9-10" />
  {%- elif name == "alert" -%}
  <circle cx="12" cy="12" r="9" /><path d="M12 7v6M12 16.5v.5" />
  {%- elif name == "globe" -%}
  <circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" />
  {%- elif name == "trash" -%}
  <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" />
  {%- endif -%}
</svg>
{%- endmacro %}
